<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <style>
    :root {
      --yellow: #ffd60a;
      --yellow-dark: #ffc300;
      --black: #111;
      --white: #fffdf2;
      --green: #2ecc71;
      --red: #ff4d4d;
      --shadow: 6px 6px 0 var(--black);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      color: var(--black);
      background:
        radial-gradient(circle at 20% 10%, #fff3a3 0, transparent 40%),
        repeating-linear-gradient(45deg, var(--yellow) 0 30px, var(--yellow-dark) 30px 60px);
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      display: inline-block;
      margin: 0;
      padding: 10px 28px;
      font-size: clamp(28px, 5vw, 54px);
      letter-spacing: 2px;
      background: var(--black);
      color: var(--yellow);
      border-radius: 14px;
      box-shadow: 6px 6px 0 var(--white);
      transform: rotate(-2deg);
    }

    .subtitle {
      margin-top: 14px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    kbd {
      background: var(--black);
      color: var(--yellow);
      border-radius: 6px;
      padding: 2px 8px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr);
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--white);
      border: 4px solid var(--black);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* camera */
    #camera {
      position: relative;
      padding: 0;
      overflow: hidden;
      background: var(--black);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #live-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--red);
      color: var(--white);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      border: 3px solid var(--black);
    }

    #live-tag::before {
      content: "● ";
      animation: blink 1s infinite;
    }

    #countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 214, 10, 0.35);
    }

    #countdown.show { display: flex; }

    #countdown span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: var(--yellow);
      border: 6px solid var(--black);
      box-shadow: var(--shadow);
      font-size: 110px;
      animation: pop 0.8s ease-out;
    }

    #countdown span.small { font-size: 54px; }

    /* side panel */
    aside {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .score {
      text-align: center;
      padding: 12px 6px;
    }

    .score .label { letter-spacing: 1px; }

    .score .value {
      font-size: 44px;
      line-height: 1.1;
    }

    .score.you { background: var(--green); }
    .score.draw { background: var(--yellow); }
    .score.cpu { background: var(--red); }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      text-align: center;
    }

    .hand {
      font-size: 72px;
      line-height: 1.2;
    }

    .hand.shake { animation: shake 0.3s infinite; }

    .move-name { font-size: 18px; }

    .vs {
      background: var(--black);
      color: var(--yellow);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-8deg);
    }

    #result {
      margin-top: 14px;
      padding: 14px;
      text-align: center;
      font-size: 26px;
      border: 4px solid var(--black);
      border-radius: 12px;
      background: var(--yellow);
    }

    #result.win { background: var(--green); }
    #result.lose { background: var(--red); color: var(--white); }
    #result.draw { background: var(--yellow); }
    #result.pop { animation: pop 0.4s ease-out; }

    .buttons {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    button {
      font: inherit;
      font-size: 22px;
      padding: 16px;
      border: 4px solid var(--black);
      border-radius: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--black); }
    button:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--black); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #play { background: var(--black); color: var(--yellow); }
    #reset { background: var(--white); }

    /* history */
    #history-card {
      max-width: 1200px;
      margin: 24px auto 0;
    }

    #history {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      min-height: 44px;
    }

    #history .empty {
      font-family: Arial, sans-serif;
      opacity: 0.6;
      align-self: center;
    }

    .chip {
      padding: 8px 14px;
      border: 3px solid var(--black);
      border-radius: 999px;
      font-size: 15px;
      animation: pop 0.3s ease-out;
    }

    .chip.win { background: var(--green); }
    .chip.draw { background: var(--yellow); }
    .chip.lose { background: var(--red); color: var(--white); }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(12deg); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✊ ROCK PAPER SCISSORS ✌️</h1>
    <div class="subtitle">Show your hand to the camera · <kbd>S</kbd> play · <kbd>R</kbd> reset</div>
  </header>

  <main>
    <section id="camera" class="card">
      <video id="video" autoplay playsinline muted></video>
      <div id="live-tag">LIVE</div>
      <div id="countdown"><span></span></div>
    </section>

    <aside>
      <div class="scores">
        <div class="card score you"><div class="label">You</div><div class="value" id="wins">0</div></div>
        <div class="card score draw"><div class="label">Draws</div><div class="value" id="draws">0</div></div>
        <div class="card score cpu"><div class="label">Computer</div><div class="value" id="losses">0</div></div>
      </div>

      <div class="card">
        <div class="arena">
          <div>
            <div class="label">You</div>
            <div class="hand" id="player-hand">❔</div>
            <div class="move-name" id="player-move">-</div>
          </div>
          <div class="vs">VS</div>
          <div>
            <div class="label">Computer</div>
            <div class="hand" id="cpu-hand">🤖</div>
            <div class="move-name" id="cpu-move">-</div>
          </div>
        </div>
        <div id="result">Press Play to start</div>
      </div>

      <div class="buttons">
        <button id="play">▶ PLAY</button>
        <button id="reset">↺ RESET</button>
      </div>
    </aside>
  </main>

  <section id="history-card" class="card">
    <div class="label">History</div>
    <div id="history"><span class="empty">No rounds played yet</span></div>
  </section>

  <script>
    const MOVES = ["Rock", "Paper", "Scissors"];
    const BEATS = { Rock: "Scissors", Paper: "Rock", Scissors: "Paper" };
    const EMOJI = { Rock: "✊", Paper: "✋", Scissors: "✌️" };
    const LABELS = { win: "You Win! 🎉", draw: "Draw 🤝", lose: "Computer Wins! 🤖" };

    const $ = id => document.getElementById(id);
    const video = $("video");
    const countdownEl = $("countdown");
    const countdownNum = countdownEl.querySelector("span");
    let score = { win: 0, draw: 0, lose: 0 };
    let playing = false;

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream)
      .catch(err => setResult("Camera error: " + err.message, ""));

    function setResult(text, cls) {
      const el = $("result");
      el.textContent = text;
      el.className = cls;
      void el.offsetWidth;  // restart animation
      el.classList.add("pop");
    }

    function setHands(player, cpu) {
      $("player-hand").textContent = EMOJI[player] || "❔";
      $("player-move").textContent = player || "-";
      $("cpu-hand").textContent = EMOJI[cpu] || "🤖";
      $("cpu-move").textContent = cpu || "-";
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function snapshot() {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return new Promise(r => canvas.toBlob(r, "image/jpeg", 0.9));
    }

    async function play() {
      if (playing) return;
      playing = true;
      $("play").disabled = true;
      setResult("Get ready...", "");
      setHands(null, null);

      // Computer hand shuffles during the countdown
      const cpuHand = $("cpu-hand");
      cpuHand.classList.add("shake");
      let i = 0;
      const shuffle = setInterval(() => cpuHand.textContent = EMOJI[MOVES[i++ % 3]], 120);

      countdownEl.classList.add("show");
      for (const step of ["3", "2", "1", "Show!"]) {
        countdownNum.textContent = step;
        countdownNum.classList.toggle("small", step === "Show!");
        countdownNum.style.animation = "none";
        void countdownNum.offsetWidth;
        countdownNum.style.animation = "";
        await sleep(800);
      }
      countdownEl.classList.remove("show");

      let move = null;
      try {
        const res = await fetch("/predict", { method: "POST", body: await snapshot() });
        move = (await res.json()).move;
      } catch (err) {
        setResult("Server error: " + err.message, "");
      }

      clearInterval(shuffle);
      cpuHand.classList.remove("shake");
      showRound(move);

      playing = false;
      $("play").disabled = false;
    }

    function showRound(player) {
      if (!MOVES.includes(player)) {
        setHands(null, null);
        setResult("No hand detected 👀", "");
        return;
      }

      const cpu = MOVES[Math.floor(Math.random() * 3)];
      let outcome;
      if (player === cpu) outcome = "draw";
      else if (BEATS[player] === cpu) outcome = "win";
      else outcome = "lose";

      score[outcome]++;
      setHands(player, cpu);
      setResult(LABELS[outcome], outcome);
      updateScore();

      const history = $("history");
      history.querySelector(".empty")?.remove();
      const chip = document.createElement("span");
      chip.className = "chip " + outcome;
      chip.textContent = `${EMOJI[player]} vs ${EMOJI[cpu]}`;
      history.prepend(chip);
    }

    function updateScore() {
      $("wins").textContent = score.win;
      $("draws").textContent = score.draw;
      $("losses").textContent = score.lose;
    }

    function reset() {
      if (playing) return;
      score = { win: 0, draw: 0, lose: 0 };
      updateScore();
      $("history").innerHTML = '<span class="empty">No rounds played yet</span>';
      setHands(null, null);
      setResult("Press Play to start", "");
    }

    $("play").onclick = play;
    $("reset").onclick = reset;
    document.addEventListener("keydown", e => {
      if (e.key === "s" || e.key === "S") play();
      if (e.key === "r" || e.key === "R") reset();
    });
  </script>
</body>
</html>
